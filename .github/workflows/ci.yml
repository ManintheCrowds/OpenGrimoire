name: CI

on:
  workflow_dispatch:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  verify-and-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Confirm Docker base image matches .nvmrc
        run: |
          version="$(tr -d '[:space:]' < .nvmrc)"
          grep -Fqx "FROM node:${version}-alpine AS base" Dockerfile

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify (lint, types, unit, discovery scripts)
        run: npm run verify

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: E2E tests
        env:
          CI: true
        run: npm run test:e2e

  fastmcp-skills:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install hash-locked FastMCP trial
        working-directory: experiments/fastmcp-skills
        run: python -m pip install --require-hashes -r requirements.txt

      - name: FastMCP skills tests
        working-directory: experiments/fastmcp-skills
        run: python -m pytest -q

  # Branch protection requires a check context literally named "CI"
  # (job id), while the real work lives in verify-and-e2e.
  CI:
    needs: [verify-and-e2e, fastmcp-skills]
    runs-on: ubuntu-latest
    steps:
      - name: Protection check alias
        run: echo "verify-and-e2e succeeded"
