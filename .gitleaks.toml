title = "Gitleaks configuration"

[extend]
useDefault = true

[allowlist]
description = "Binary assets and generated local artifacts."
paths = [
  '''.*\.png$''',
  '''.*\.jpg$''',
  '''.*\.jpeg$''',
  '''.*\.gif$''',
  '''.*\.pdf$''',
  '''^\.next/''',
  '''^out/''',
  '''^data/''',
  '''^playwright-report/''',
  '''^test-results/'''
]
