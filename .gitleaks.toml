title = "Gitleaks configuration"

[extend]
useDefault = true

[allowlist]
description = "Docs, binaries, local dev env, and build artifacts."
paths = [
  '''.*\.svg$''',
  '''.*\.png$''',
  '''.*\.jpg$''',
  '''.*\.jpeg$''',
  '''.*\.gif$''',
  '''.*\.pdf$''',
  '''\.next/''',
  '''out/''',
  '''/data/''',
  '''playwright-report/''',
  '''test-results/'''
]
