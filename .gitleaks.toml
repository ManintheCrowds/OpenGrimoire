title = "Gitleaks configuration"

[extend]
useDefault = true

[[allowlists]]
description = "Binary artifacts and generated output that should not carry source secrets."
paths = [
  '''.*\.png$''',
  '''.*\.jpg$''',
  '''.*\.jpeg$''',
  '''.*\.gif$''',
  '''.*\.pdf$''',
  '''\.next/''',
  '''out/''',
  '''/data/''',
  '''playwright-report/''',
  '''test-results/'''
]
